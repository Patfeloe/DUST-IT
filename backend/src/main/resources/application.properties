# DUST-IT backend configuration
#
# Datasource settings are read from environment variables, with local
# Postgres as the fallback default so nothing breaks if you haven't set
# them. This is how you switch to RDS without touching this file or
# committing credentials to git:
#
#   export DB_URL=jdbc:postgresql://<your-rds-endpoint>:5432/dustit
#   export DB_USERNAME=<your-rds-username>
#   export DB_PASSWORD=<your-rds-password>
#   mvn spring-boot:run
#
# Unset (or don't export) any of them and it falls back to local Postgres.

spring.application.name=dust-it-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dustit}
spring.datasource.username=${DB_USERNAME:dustit}
spring.datasource.password=${DB_PASSWORD:dustit}

# S3 bucket used for resource thumbnails (build-order step 5).
# Region defaults to af-south-1 (Cape Town) - change if you created your
# bucket elsewhere. No AWS keys go here - see S3Config.java for why.
aws.region=${AWS_REGION:af-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:dust-it-resources}

# SQS queue for learning events (build-order step 7). If left unset, the
# app still runs fine - events are just logged as skipped instead of
# published, so local dev doesn't require an AWS account until you
# actually want to test this piece.
aws.sqs.queue-url=${AWS_SQS_QUEUE_URL:}

# Cognito User Pool issuer URI (build-order step 9). If left unset, ALL
# endpoints stay open with no authentication - this is a local-dev
# fallback, not something to leave unset in a real deployment. See
# SecurityConfig.java for why, and the root README for how to create a
# User Pool and get this value.
cognito.issuer-uri=${COGNITO_ISSUER_URI:}

# Lets Hibernate create/update tables automatically while you're building
# early features. Switch to "validate" once you have real data you care
# about, and manage schema changes deliberately from then on.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080